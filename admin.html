<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d81b60;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 30px; }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; }

        header { background: var(--card-bg); padding: 15px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; display: none; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; color: white; outline: none; }

        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 0.85rem; width: auto; border-radius: 6px; }

        /* شاشة التحميل عند النشر */
        #loadingIndicator { display: none; text-align: center; color: #38bdf8; font-weight: bold; margin-top: 10px; }

        .order-card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .product-item { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center; }
        .product-item img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color:var(--primary); margin-bottom:15px;">🔐 تسجيل الدخول</h2>
            <div class="form-group"><input type="password" id="passInput" placeholder="كلمة السر"></div>
            <button class="btn" onclick="checkPassword()">دخول</button>
        </div>
    </div>

    <header><h2>⚙️ لوحة إدارة المتجر</h2></header>

    <div class="container" id="mainContent">

        <div class="card">
            <h3>✨ إضافة منتج جديد</h3>
            <form id="productForm">
                <div class="form-group"><label>اسم المنتج:</label><input type="text" id="pName" required></div>
                <div class="form-group">
                    <label>الفئة:</label>
                    <select id="pCat" required>
                        <option value="العناية بالبشرة">العناية بالبشرة</option>
                        <option value="الكريمان والمرطبات">الكريمان والمرطبات</option>
                        <option value="المكياج والجمال">المكياج والجمال</option>
                    </select>
                </div>
                <div class="form-group"><label>الوصف:</label><textarea id="pDesc"></textarea></div>
                <div class="form-group"><label>السعر (د.ج):</label><input type="number" id="pPrice" required></div>
                <div class="form-group"><label>الكمية المتاحة:</label><input type="number" id="pQty" value="1" min="1" required></div>
                <div class="form-group"><label>صورة المنتج:</label><input type="file" id="pImgFile" accept="image/*" required></div>
                <button type="submit" class="btn" id="submitBtn">حفظ ونشر المنتج</button>
                <div id="loadingIndicator">⏳ جاري رفع المنتج، يرجى الانتظار...</div>
            </form>
        </div>

        <div class="card">
            <h3>📦 الطلبات الواردة</h3>
            <div id="ordersContainer">جاري التحميل...</div>
        </div>

        <div class="card">
            <h3>🛍️ المنتجات الحالية</h3>
            <div class="products-grid" id="productsContainer">جاري التحميل...</div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD60g3bc-e6h9JMRUR3eKcD5oRO2rAb4vQ",
          authDomain: "beauty-store-4f012.firebaseapp.com",
          projectId: "beauty-store-4f012",
          storageBucket: "beauty-store-4f012.firebasestorage.app",
          messagingSenderId: "1053116874470",
          appId: "1:1053116874470:web:32a41e8ce3e089d1920527"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_PASSWORD = "123";
        let compressedBase64Image = "";

        window.checkPassword = function() {
            if (document.getElementById('passInput').value === ADMIN_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadData();
            } else { alert("كلمة السر خاطئة!"); }
        };

        document.getElementById('pImgFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxWidth = 600;
                        canvas.width = maxWidth;
                        canvas.height = img.height * (maxWidth / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        compressedBase64Image = canvas.toDataURL('image/jpeg', 0.65);
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!compressedBase64Image) return alert("يرجى اختيار صورة!");

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loadingIndicator');
            submitBtn.disabled = true;
            loading.style.display = 'block';

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('pName').value,
                    category: document.getElementById('pCat').value,
                    description: document.getElementById('pDesc').value,
                    price: Number(document.getElementById('pPrice').value),
                    stock: Number(document.getElementById('pQty').value),
                    image: compressedBase64Image,
                    createdAt: serverTimestamp()
                });
                alert("تم إضافة المنتج بنجاح!");
                document.getElementById('productForm').reset();
                compressedBase64Image = "";
                loadProducts();
            } catch (err) { alert("خطأ في الإضافة: " + err.message); }
            finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function loadData() { loadOrders(); loadProducts(); }

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            try {
                const snapshot = await getDocs(collection(db, "orders"));
                container.innerHTML = snapshot.empty ? "<p>لا توجد طلبات.</p>" : "";
                snapshot.forEach(docSnap => {
                    const o = docSnap.data();
                    container.innerHTML += `
                        <div class="order-card">
                            <div>
                                <strong>👤 ${o.customerName}</strong> (${o.phone})<br>
                                📍 ${o.address}<br>
                                🛒 ${o.items.map(i => `${i.name} [x${i.qty}]`).join(', ')} - <strong>${o.total} د.ج</strong>
                            </div>
                            <button class="btn btn-delete" onclick="deleteOrder('${docSnap.id}')">حذف الطلب</button>
                        </div>
                    `;
                });
            } catch (e) { container.innerHTML = "خطأ في تحميل الطلبات."; }
        }

        async function loadProducts() {
            const container = document.getElementById('productsContainer');
            try {
                const snapshot = await getDocs(collection(db, "products"));
                container.innerHTML = snapshot.empty ? "<p>لا توجد منتجات.</p>" : "";
                snapshot.forEach(docSnap => {
                    const prod = docSnap.data();
                    container.innerHTML += `
                        <div class="product-item">
                            <img src="${prod.image}">
                            <h4>${prod.name}</h4>
                            <p style="color:var(--primary); font-weight:bold;">${prod.price} د.ج</p>
                            <button class="btn btn-delete" onclick="deleteProduct('${docSnap.id}')" style="margin-top:5px;">حذف</button>
                        </div>
                    `;
                });
            } catch (e) { container.innerHTML = "خطأ في التحميل."; }
        }

        window.deleteOrder = async function(id) {
            if(confirm("هل تريد حذف هذا الطلب؟")) {
                await deleteDoc(doc(db, "orders", id));
                loadOrders();
            }
        };

        window.deleteProduct = async function(id) {
            if(confirm("هل تريد حذف هذا المنتج؟")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };
    </script>
</body>
</html>
