<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية - متجر الجمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d81b60;
            --primary-hover: #ad1457;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding-bottom: 30px; }

        /* شاشة تسجيل الدخول */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-box h2 { margin-bottom: 20px; color: var(--primary); }

        /* الهيكل الرئيسي */
        header { background: var(--card-bg); padding: 15px 20px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; display: none; }
        
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .card h3 { margin-bottom: 15px; color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        /* النماذج المدخلة */
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select {
            width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border-color);
            border-radius: 8px; color: white; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); }
        
        /* معاينة الصورة */
        #imgPreview { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid var(--primary); }

        /* الأزرار */
        .btn {
            width: 100%; padding: 12px; background: var(--primary); color: white; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem;
        }
        .btn:hover { background: var(--primary-hover); }

        /* قائمة الطلبات والمنتجات */
        .order-card {
            background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px;
            padding: 15px; margin-bottom: 12px;
        }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 8px; font-weight: bold; }
        .badge { background: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .product-item { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center; }
        .product-item img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
        .btn-delete { background: #ef4444; margin-top: 8px; padding: 6px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- نافذة كلمة السر -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔐 دخول Admin</h2>
            <div class="form-group">
                <input type="password" id="passInput" placeholder="أدخل كلمة السر">
            </div>
            <button class="btn" onclick="checkPassword()">دخول</button>
            <p id="errorMsg" style="color:#ef4444; margin-top:10px; display:none;">كلمة السر خاطئة!</p>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <header>
        <h2>👑 لوحة إدارة المتجر</h2>
    </header>

    <div class="container" id="mainContent">

        <!-- إضافة منتج -->
        <div class="card">
            <h3>✨ إضافة منتج جديد</h3>
            <form id="productForm">
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <input type="text" id="pName" placeholder="مثال: عطور الفخامة" required>
                </div>
                <div class="form-group">
                    <label>السعر (د.ج):</label>
                    <input type="number" id="pPrice" placeholder="4500" required>
                </div>
                <div class="form-group">
                    <label>صورة المنتج (اختر من المعرض):</label>
                    <input type="file" id="pImgFile" accept="image/*" required>
                    <img id="imgPreview" alt="معاينة الصورة">
                </div>
                <button type="submit" class="btn">حفظ ونشر المنتج</button>
            </form>
        </div>

        <!-- الطلبات الواردة -->
        <div class="card">
            <h3>📦 الطلبات الواردة</h3>
            <div id="ordersContainer">جاري تحميل الطلبات...</div>
        </div>

        <!-- إدارة المنتجات الحالية -->
        <div class="card">
            <h3>🛍️ المنتجات الحالية</h3>
            <div class="products-grid" id="productsContainer">جاري تحميل المنتجات...</div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyD60g3bc-e6h9JMRUR3eKcD5oRO2rAb4vQ",
          authDomain: "beauty-store-4f012.firebaseapp.com",
          projectId: "beauty-store-4f012",
          storageBucket: "beauty-store-4f012.firebasestorage.app",
          messagingSenderId: "1053116874470",
          appId: "1:1053116874470:web:32a41e8ce3e089d1920527"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // كلمة السر الافتراضية
        const ADMIN_PASSWORD = "123"; 

        let base64Image = "";

        // التحقق من كلمة السر
        window.checkPassword = function() {
            const pass = document.getElementById('passInput').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadData();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        };

        // تحويل الصورة المرفوعة من المعرض إلى Base64 مع ضغط حجمها
        document.getElementById('pImgFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxWidth = 500;
                        const scaleSize = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scaleSize;

                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        base64Image = canvas.toDataURL('image/jpeg', 0.7); // ضغط الصورة لسرعة التحميل
                        
                        const preview = document.getElementById('imgPreview');
                        preview.src = base64Image;
                        preview.style.display = 'block';
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        // إرسال المنتج للـ Firebase
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!base64Image) return alert("يرجى اختيار صورة أولاً!");

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('pName').value,
                    price: Number(document.getElementById('pPrice').value),
                    image: base64Image,
                    createdAt: serverTimestamp()
                });
                alert("تمت إضافة المنتج بنجاح!");
                document.getElementById('productForm').reset();
                document.getElementById('imgPreview').style.display = 'none';
                base64Image = "";
                loadProducts();
            } catch (err) {
                alert("حدث خطأ أثناء الإضافة: " + err.message);
            }
        });

        // جلب البيانات (الطلبات والمنتجات)
        async function loadData() {
            loadOrders();
            loadProducts();
        }

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            try {
                const snapshot = await getDocs(collection(db, "orders"));
                container.innerHTML = snapshot.empty ? "<p>لا توجد طلبات بعد.</p>" : "";
                
                snapshot.forEach(docSnap => {
                    const order = docSnap.data();
                    const itemsText = order.items.map(i => `${i.name} (${i.qty})`).join(', ');
                    container.innerHTML += `
                        <div class="order-card">
                            <div class="order-header">
                                <span>👤 ${order.customerName}</span>
                                <span class="badge">${order.total} د.ج</span>
                            </div>
                            <p>📞 <strong>الهاتف:</strong> ${order.phone}</p>
                            <p>📍 <strong>العنوان:</strong> ${order.address}</p>
                            <p>🛒 <strong>الطلبات:</strong> ${itemsText}</p>
                        </div>
                    `;
                });
            } catch (e) { container.innerHTML = "خطأ في التحميل."; }
        }

        async function loadProducts() {
            const container = document.getElementById('productsContainer');
            try {
                const snapshot = await getDocs(collection(db, "products"));
                container.innerHTML = snapshot.empty ? "<p>لا توجد منتجات.</p>" : "";

                snapshot.forEach(docSnap => {
                    const prod = docSnap.data();
                    container.innerHTML += `
                        <div class="product-item">
                            <img src="${prod.image}">
                            <h4>${prod.name}</h4>
                            <p style="color:var(--primary); font-weight:bold;">${prod.price} د.ج</p>
                            <button class="btn btn-delete" onclick="deleteProduct('${docSnap.id}')">حذف</button>
                        </div>
                    `;
                });
            } catch (e) { container.innerHTML = "خطأ في التحميل."; }
        }

        window.deleteProduct = async function(id) {
            if (confirm("هل أنت تأكد من حذف هذا المنتج؟")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };
    </script>
</body>
</html>
