<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر لمسة جمال | أحدث مستحضرات التجميل والعناية</title>
    <!-- CSS الخاص بالمتجر -->
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- الهيدر وشريط التنقل -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>لمسة جمال</span>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="ابحث عن كريم، مكياج، أو منتج عناية...">
            <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="cart-icon" id="cartBtn">
            <i class="fa-solid fa-bag-shopping"></i>
            <span id="cartCount">0</span>
        </div>
    </header>

    <!-- أقسام المنتجات -->
    <section class="categories">
        <button class="cat-btn active" data-category="all">الكل</button>
        <button class="cat-btn" data-category="skincare">العناية بالبشرة</button>
        <button class="cat-btn" data-category="creams">الكريمان والمرطبات</button>
        <button class="cat-btn" data-category="makeup">المكياج والجمال</button>
    </section>

    <!-- شبكة عرض المنتجات -->
    <main class="products-container">
        <h2 class="section-title">أحدث المنتجات</h2>
        <div class="products-grid" id="productsGrid">
            <!-- سيتم تحميل المنتجات هنا ديناميكياً بواسطة JavaScript من Firebase -->
            <p class="loading-text">جاري تحميل المنتجات...</p>
        </div>
    </main>

    <!-- نافذة سلة الشراء (Modal) -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h3>سلة التسوق</h3>
                <span class="close-cart" id="closeCart">&times;</span>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- عناصر السلة تُضاف هنا -->
            </div>
            <div class="cart-footer">
                <div class="total-price">
                    <span>الإجمالي:</span>
                    <span id="totalAmount">0 د.ج</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn">إتمام الطلب</button>
            </div>
        </div>
    </div>

    <!-- نافذة نموذج إتمام الطلب -->
    <div class="checkout-modal" id="checkoutModal">
        <div class="checkout-content">
            <h3>تأكيد الطلب</h3>
            <form id="orderForm">
                <input type="text" id="custName" placeholder="الاسم الكامل" required>
                <input type="tel" id="custPhone" placeholder="رقم الهاتف" required>
                <input type="text" id="custAddress" placeholder="العنوان والولاية" required>
                <button type="submit" class="submit-order-btn">إرسال الطلب الآن</button>
                <button type="button" class="cancel-btn" id="cancelOrder">إلغاء</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (Version 9+) -->
    <script type="module" src="script.js"></script>
</body>
</html>
