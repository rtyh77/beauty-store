<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لمسة جمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d81b60;
            --gold: #d4af37;
            --bg-color: #1e293b;
            --card-bg: #0f172a;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; }

        header { background: #0f172a; padding: 15px 20px; text-align: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.6rem; font-weight: 700; color: var(--gold); }

        .search-container { padding: 15px 20px 5px 20px; }
        .search-box { position: relative; width: 100%; }
        .search-box input { width: 100%; padding: 12px 45px 12px 15px; border: 1px solid var(--border-color); border-radius: 25px; outline: none; background: #0f172a; color: white; font-size: 0.95rem; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .categories { display: flex; gap: 10px; overflow-x: auto; padding: 10px 20px; scrollbar-width: none; }
        .cat-btn { padding: 8px 18px; border: 1px solid var(--primary); border-radius: 20px; background: #0f172a; color: white; white-space: nowrap; cursor: pointer; font-weight: 600; }
        .cat-btn.active { background: var(--primary); color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .product-card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        
        /* معرض الصور للتمرير الأفقي */
        .slider-container { position: relative; width: 100%; height: 230px; overflow: hidden; }
        .slider { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .slider::-webkit-scrollbar { display: none; }
        .slider img { min-width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; flex-shrink: 0; }
        .slider-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; z-index: 10; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); }
        .dot.active { background: var(--primary); width: 12px; border-radius: 4px; }

        .product-info { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 5px; color: #ffffff; }
        .product-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; flex: 1; }
        .product-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .price { font-size: 1.25rem; font-weight: 700; color: #f43f5e; }
        .stock { font-size: 0.8rem; background: #1e293b; padding: 4px 10px; border-radius: 6px; color: var(--text-muted); border: 1px solid var(--border-color); }

        .btn-buy { background: var(--primary); color: white; border: none; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }

        .whatsapp-float {
            position: fixed; bottom: 25px; left: 25px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white; width: 60px; height: 60px; border-radius: 50%;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.45);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            text-decoration: none; animation: pulse 2s infinite;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .whatsapp-float svg { width: 32px; height: 32px; fill: white; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 14px; width: 90%; max-width: 400px; border: 1px solid var(--border-color); }
        .form-control { margin-bottom: 12px; }
        .form-control input { width: 100%; padding: 11px; background: #1e293b; border: 1px solid var(--border-color); border-radius: 6px; color: white; outline: none; }

        .qty-picker { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 15px 0; }
        .qty-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--primary); background: #1e293b; color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .qty-number { font-size: 1.2rem; font-weight: bold; width: 30px; text-align: center; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo">✨ لمسة جمال</div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="ابحث عن منتج..." onkeyup="filterProducts()">
        </div>
    </div>

    <div class="categories">
        <button class="cat-btn active" onclick="filterCat('الكل', event)">الكل</button>
        <button class="cat-btn" onclick="filterCat('العناية بالبشرة', event)">العناية بالبشرة</button>
        <button class="cat-btn" onclick="filterCat('الكريمان والمرطبات', event)">الكريمان والمرطبات</button>
        <button class="cat-btn" onclick="filterCat('المكياج والجمال', event)">المكياج والجمال</button>
    </div>

    <div class="products-grid" id="productsGrid">جاري تحميل المنتجات...</div>

    <a id="waBtn" href="https://wa.me/213656708603" class="whatsapp-float" target="_blank" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M19.05 4.91A9.816 9.816 0 0 0 12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01zm-7.01 15.24c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.8-.23-.09-.39-.12-.56.12-.17.25-.66.8-.81.97-.15.17-.3.19-.55.07-.25-.12-1.05-.39-2.01-1.24-.74-.66-1.24-1.48-1.39-1.73-.15-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.15.17-.25.25-.42.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.12.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.43.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.07-.11-.23-.18-.48-.3z"/></svg>
    </a>

    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px; color:var(--primary); text-align:center;">تأكيد الطلب</h3>
            <div class="qty-picker">
                <button class="qty-btn" onclick="changeQty(-1)">➖</button>
                <span class="qty-number" id="orderQty">1</span>
                <button class="qty-btn" onclick="changeQty(1)">➕</button>
            </div>
            <div class="form-control"><input type="text" id="custName" placeholder="الاسم الكامل" required></div>
            <div class="form-control"><input type="tel" id="custPhone" placeholder="رقم الهاتف" required></div>
            <div class="form-control"><input type="text" id="custAddress" placeholder="العنوان والولاية" required></div>
            <button class="btn-buy" onclick="submitOrder()">إرسال الطلب الآن</button>
            <button class="btn-buy" onclick="closeModal()" style="background:#475569; margin-top:8px;">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD60g3bc-e6h9JMRUR3eKcD5oRO2rAb4vQ",
          authDomain: "beauty-store-4f012.firebaseapp.com",
          projectId: "beauty-store-4f012",
          storageBucket: "beauty-store-4f012.firebasestorage.app",
          messagingSenderId: "1053116874470",
          appId: "1:1053116874470:web:32a41e8ce3e089d1920527"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let selectedProduct = null;
        let currentQty = 1;
        let activeCategory = 'الكل';

        async function initStore() {
            await loadSettings();
            await fetchProducts();
        }

        async function loadSettings() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "store_config"));
                if (docSnap.exists() && docSnap.data().whatsapp) {
                    document.getElementById('waBtn').href = `https://wa.me/${docSnap.data().whatsapp}`;
                }
            } catch (e) {}
        }

        async function fetchProducts() {
            const grid = document.getElementById('productsGrid');
            try {
                const snapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                snapshot.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
                renderProducts(allProducts);
            } catch (e) { grid.innerHTML = "<p style='text-align:center;'>خطأ في تحميل البيانات.</p>"; }
        }

        function renderProducts(list) {
            const grid = document.getElementById('productsGrid');
            if (list.length === 0) { grid.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>لا توجد منتجات مطابقة.</p>"; return; }
            grid.innerHTML = list.map(p => {
                const images = p.images && p.images.length ? p.images : [p.image];
                const sliderHtml = `
                    <div class="slider-container">
                        <div class="slider">
                            ${images.map(img => `<img src="${img}" alt="${p.name}">`).join('')}
                        </div>
                        ${images.length > 1 ? `<div class="slider-dots">${images.map((_, i) => `<div class="dot ${i===0?'active':''}"></div>`).join('')}</div>` : ''}
                    </div>
                `;
                return `
                <div class="product-card">
                    ${sliderHtml}
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-desc">${p.description || ''}</div>
                        <div class="product-meta">
                            <span class="price">${p.price} د.ج</span>
                            <span class="stock">الكمية: ${p.stock || 1}</span>
                        </div>
                        <button class="btn-buy" onclick="openOrderModal('${p.id}')">طلب</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        window.filterProducts = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchCat = (activeCategory === 'الكل' || p.category === activeCategory);
                const matchSearch = p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query));
                return matchCat && matchSearch;
            });
            renderProducts(filtered);
        };

        window.filterCat = function(cat, event) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            activeCategory = cat;
            filterProducts();
        };

        window.openOrderModal = function(id) {
            selectedProduct = allProducts.find(p => p.id === id);
            currentQty = 1;
            document.getElementById('orderQty').innerText = currentQty;
            document.getElementById('orderModal').style.display = 'flex';
        };

        window.closeModal = function() { document.getElementById('orderModal').style.display = 'none'; };

        window.changeQty = function(amount) {
            if (currentQty + amount >= 1) {
                currentQty += amount;
                document.getElementById('orderQty').innerText = currentQty;
            }
        };

        window.submitOrder = async function() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;

            if(!name || !phone || !address) return alert("يرجى ملء كافة الحقول!");

            try {
                await addDoc(collection(db, "orders"), {
                    customerName: name, phone: phone, address: address,
                    items: [{ name: selectedProduct.name, qty: currentQty, price: selectedProduct.price }],
                    total: selectedProduct.price * currentQty,
                    createdAt: serverTimestamp()
                });
                alert("تم تسجيل طلبك بنجاح!");
                closeModal();
            } catch (e) { alert("حدث خطأ أثناء الإرسال!"); }
        };

        initStore();
    </script>
</body>
</html>
